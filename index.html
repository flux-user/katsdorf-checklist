<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katsdorf Checklist</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Katsdorf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121414" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1b1f1e; --muted:#6c7471; --line:#e4e2db;
  --accent:#1f7a5c; --accent-ink:#ffffff; --done-bg:#eaf5ef; --wt:#b8661a; --wt-bg:#fff4e6; --danger:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121414; --card:#1c1f1e; --ink:#eceeed; --muted:#9aa3a0; --line:#2b302f;
    --accent:#3fae88; --accent-ink:#0b1512; --done-bg:#173026; --wt:#f0a35a; --wt-bg:#2d2113; --danger:#ef7767; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:0 0 calc(40px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:22px;margin:0;flex:1;letter-spacing:-.2px}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:22px;line-height:1;box-shadow:0 0 0 1px var(--line) inset}
.prog{margin-top:8px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
main{padding:12px 16px}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:8px}
.ctrl button{border:0;border-radius:16px;background:var(--card);color:var(--accent);font-size:14px;font-weight:600;padding:7px 13px;box-shadow:0 0 0 1px var(--line) inset}
.ctrl span{font-size:13px;color:var(--muted);margin-left:2px}
.group{transition:transform .14s}
.group.dragging{transition:none;position:relative;z-index:3;box-shadow:0 8px 26px rgba(0,0,0,.3)}
.group{background:var(--card);border-radius:16px;margin:0 0 14px;box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
.group.wt{box-shadow:0 0 0 2px var(--wt) inset;background:var(--card)}
.ghead{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;min-height:50px}
.group.wt .ghead{background:var(--wt-bg);color:var(--wt)}
.ghead .name{flex:1;font-weight:650;font-size:17px;padding:12px 0;cursor:pointer;user-select:none}
.ghead .cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.group.wt .cnt{color:var(--wt)}
.ghead .chev{font-size:13px;color:var(--muted);width:18px;text-align:center;transition:transform .15s}
.group.collapsed .chev{transform:rotate(-90deg)}
.group.collapsed .gbody{display:none}
.group.complete .cnt{color:var(--accent);font-weight:700}
.gbtn{border:0;background:transparent;color:var(--muted);width:40px;height:44px;font-size:22px}
.task{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;border-top:1px solid var(--line);min-height:56px}
.task.done{background:var(--done-bg)}
.grip{border:0;background:transparent;color:var(--muted);width:36px;height:44px;font-size:24px;line-height:1;touch-action:pan-y;cursor:grab;flex:none;padding:0}
.task{transition:transform .14s,box-shadow .14s}
.task.dragging{transition:none;position:relative;z-index:3;background:var(--card);box-shadow:0 6px 22px rgba(0,0,0,.28);border-radius:12px}
.task.dragging.done{background:var(--done-bg)}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:transparent;transition:.12s}
.chk svg{width:20px;height:20px}
.task.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.txt{flex:1;padding:8px 0;min-width:0;word-wrap:break-word;overflow-wrap:anywhere;cursor:pointer}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.wtmark{color:var(--wt);font-size:15px;margin-left:6px;white-space:nowrap}
.txt small{display:block;font-size:12.5px;color:var(--muted);text-decoration:none}
.add{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.add input{flex:1;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.add button{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;padding:0 16px}
.empty{padding:14px;color:var(--muted);font-size:15px}
.big{display:block;width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:14px;padding:14px;font-size:16px;margin-top:4px}
.welcome{text-align:center;padding:40px 20px;color:var(--muted)}
.welcome h2{color:var(--ink);margin:0 0 8px}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:17px;font-weight:600;background:var(--accent);color:var(--accent-ink);margin:6px 4px}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.35;pointer-events:none}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s;box-shadow:0 -4px 30px rgba(0,0,0,.25)}
#sheet.open{transform:none}
#sheet h3{margin:0 0 12px;font-size:19px}
#sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
#sheet input[type=text],#sheet select{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.row input[type=checkbox]{width:28px;height:28px;accent-color:var(--wt)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;margin:0;min-width:110px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font-size:18px;padding:15px 4px;border-bottom:1px solid var(--line)}
.menu button.danger{color:var(--danger)}
.menu button:last-child{border-bottom:0}
.note{font-size:14px;color:var(--muted);margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Katsdorf Checklist</h1>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">&#8943;</button>
  </div>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progTxt"></span></div>
  <div class="ctrl" id="ctrl"><button id="collapseAll">Collapse all</button><button id="expandAll">Expand all</button><span id="ctrlHint"></span></div>
</header>
<main id="main"></main>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<input type="file" id="fileImport" accept=".xlsx,.xls,.csv,.txt" hidden>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>

<script>
'use strict';
var KEY = 'katsdorf-checklist-v1';
var S = load();

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function normalize(s){
  var fix = function(list, key){ (list||[]).forEach(function(o){ if (o && typeof o[key] === 'string') o[key] = capFirst(o[key].replace(/^\s+/, '')); }); };
  fix(s.categories, 'name'); fix(s.tasks, 'text');
  (s.archive||[]).forEach(function(a){ fix(a.categories, 'name'); fix(a.tasks, 'text'); });
  return s;
}
function load(){
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.tasks) && Array.isArray(s.categories)) { s.collapsed = s.collapsed||{}; s.archive = s.archive||[]; return normalize(s); } } catch(e){}
  return { categories: [], tasks: [], hideDone: false, collapsed: {}, archive: [] };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function h(tag, attrs, kids){
  var el = document.createElement(tag);
  if (tag === 'input') el.setAttribute('autocapitalize', 'sentences');
  for (var k in (attrs||{})) {
    if (k === 'class') el.className = attrs[k];
    else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'text') el.textContent = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(function(c){ if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}
function catById(id){ return S.categories.find(function(c){ return c.id === id; }); }
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2200); }

/* ---------- render ---------- */
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function render(){
  var main = document.getElementById('main');
  var scroll = window.scrollY;
  var hasList = S.tasks.length || S.categories.length;
  document.getElementById('ctrl').style.display = hasList ? 'flex' : 'none';
  document.getElementById('ctrlHint').textContent = allCollapsed() ? 'Hold \u2261 and drag to reorder categories' : '';
  main.innerHTML = '';
  var total = S.tasks.length, done = S.tasks.filter(function(t){ return t.done; }).length;
  document.getElementById('barFill').style.width = (total ? done/total*100 : 0) + '%';
  document.getElementById('progTxt').textContent = total ? (done + ' / ' + total + ' done') : 'No items yet';

  if (!total && !S.categories.length) {
    main.appendChild(h('div', {class:'welcome'}, [
      h('h2', {text:'Your list is empty'}),
      h('p', {text:'Load the built-in Katsdorf list, or import your own Excel file.'}),
      h('button', {class:'btn', onclick:function(){ document.getElementById('fileImport').click(); }, text:'Import Excel / CSV'}),
      h('button', {class:'btn sec', onclick:loadSeed, text:'Load Katsdorf list'}),
      h('button', {class:'btn sec', onclick:function(){ newCategorySheet(); }, text:'Add first category'})
    ]));
    return;
  }

  var wt = S.tasks.filter(function(t){ return t.wt; });
  if (wt.length) main.appendChild(groupEl({ id:'__wt', name:'Final walk-through', wt:true }, wt));
  S.categories.forEach(function(c){
    var ts = S.tasks.filter(function(t){ return !t.wt && t.cat === c.id; });
    main.appendChild(groupEl(c, ts));
  });
  main.appendChild(h('button', {class:'big', onclick:function(){ newCategorySheet(); }, text:'+ New category'}));
  window.scrollTo(0, scroll);
}

function allCollapsed(){ return S.categories.length > 1 && S.categories.every(function(c){ return !!S.collapsed[c.id]; }); }

function groupEl(c, ts){
  var d = ts.filter(function(t){ return t.done; }).length;
  var collapsed = c.wt ? S.collapsed[c.id] !== false : !!S.collapsed[c.id];   // walk-through group starts collapsed
  var g = h('div', {class:'group' + (c.wt ? ' wt' : '') + (collapsed ? ' collapsed' : '') + (ts.length && d === ts.length ? ' complete' : '')});
  var head = h('div', {class:'ghead'}, [
    h('span', {class:'chev', text:'▼'}),
    h('div', {class:'name', text:(c.wt ? '★ ' : '') + c.name, onclick:function(){ S.collapsed[c.id] = c.wt ? (collapsed ? false : true) : !S.collapsed[c.id]; save(); render(); }}),
    h('span', {class:'cnt', text: d + '/' + ts.length})
  ]);
  if (!c.wt) head.appendChild(h('button', {class:'gbtn', 'aria-label':'Category options', text:'⋯', onclick:function(){ categorySheet(c); }}));
  if (!c.wt && allCollapsed()) head.appendChild(categoryGrip());
  g.appendChild(head);
  var body = h('div', {class:'gbody'});
  var shown = ts.filter(function(t){ return !(S.hideDone && t.done); });
  shown.forEach(function(t){ body.appendChild(taskEl(t, c.wt, shown)); });
  if (!shown.length) body.appendChild(h('div', {class:'empty', text: ts.length ? 'All done here.' : 'No items yet.'}));
  if (!c.wt) {
    var inp = h('input', {type:'text', placeholder:'Add item…', enterkeyhint:'done', autocapitalize:'sentences'});
    var add = function(){
      var v = inp.value.trim(); if (!v) return;
      S.tasks.push({ id:uid(), text:capFirst(v), cat:c.id, done:false, wt:false });
      save(); render();
    };
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') add(); });
    body.appendChild(h('div', {class:'add'}, [inp, h('button', {text:'Add', onclick:add})]));
  }
  g.appendChild(body);
  return g;
}

function taskEl(t, showOrigin, list){
  var origin = showOrigin && catById(t.cat) ? catById(t.cat).name : '';
  var inWt = !t.wt && S.tasks.some(function(x){ return x.wt && x.srcId === t.id; });
  var toggle = function(){
    if (t.done) { toast('Already done \u2014 use \u22EF to untick'); return; }
    t.done = true; t.doneAt = new Date().toISOString(); save(); render();
  };
  var chk = h('button', {class:'chk', 'aria-label': t.done ? 'Done' : 'Mark done', 'aria-pressed': String(t.done), onclick:toggle});
  chk.innerHTML = CHECK;
  return h('div', {class:'task' + (t.done ? ' done' : '')}, [
    chk,
    h('div', {class:'txt', onclick:toggle}, [t.text, inWt ? h('span', {class:'wtmark', text:'\u2605', title:'Also on the final walk-through list'}) : null, origin ? h('small', {text:origin}) : null]),
    h('button', {class:'gbtn', 'aria-label':'Edit item', text:'⋯', onclick:function(){ taskSheet(t); }}),
    list && list.length > 1 ? taskGrip(list) : null
  ]);
}

/* ---------- drag to reorder ---------- */
// Touch: press and HOLD the handle (~0.2 s) before it picks the item up; a normal swipe over it just scrolls.
// Mouse: drag immediately.
function gripEl(label, begin){
  var g = h('button', {class:'grip', 'aria-label':label, text:'≡'});
  g.addEventListener('pointerdown', function(e){ armDrag(e, g, begin); });
  return g;
}
function taskGrip(list){
  return gripEl('Hold and drag to reorder item', function(ev, g){
    var row = g.parentNode;
    var rows = Array.prototype.filter.call(row.parentNode.children, function(n){ return n.classList.contains('task'); });
    startDrag(ev, g, row, rows, function(from, to){
      var items = list.slice(), m = items.splice(from, 1)[0]; items.splice(to, 0, m);
      var idx = list.map(function(x){ return S.tasks.indexOf(x); }).sort(function(a, b){ return a - b; });
      idx.forEach(function(pos, k){ S.tasks[pos] = items[k]; });
    });
  });
}
function categoryGrip(){
  return gripEl('Hold and drag to reorder category', function(ev, g){
    var row = g.parentNode.parentNode;
    var rows = Array.prototype.filter.call(row.parentNode.children, function(n){ return n.classList.contains('group') && !n.classList.contains('wt'); });
    startDrag(ev, g, row, rows, function(from, to){
      var m = S.categories.splice(from, 1)[0]; S.categories.splice(to, 0, m);
    });
  });
}
function armDrag(e, grip, begin){
  if (e.pointerType === 'mouse') {
    if (e.button !== 0) return;
    e.preventDefault(); begin({ pointerId:e.pointerId, clientY:e.clientY }, grip); return;
  }
  var id = e.pointerId, sx = e.clientX, sy = e.clientY, ly = sy, tm;
  function stop(){ clearTimeout(tm); grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', stop); grip.removeEventListener('pointercancel', stop); }
  function mv(ev){ ly = ev.clientY; if (Math.abs(ev.clientY - sy) > 8 || Math.abs(ev.clientX - sx) > 8) stop(); }
  tm = setTimeout(function(){ stop(); begin({ pointerId:id, clientY:ly }, grip); }, 220);
  grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', stop); grip.addEventListener('pointercancel', stop);
}
function startDrag(e, grip, row, rows, onDrop){
  var from = rows.indexOf(row); if (from < 0) return;
  var sy0 = window.scrollY, startY = e.clientY, lastY = e.clientY, to = from;
  var tops = rows.map(function(r){ var b = r.getBoundingClientRect(); return { top:b.top + sy0, h:b.height }; });
  var rh = tops[from].h;
  row.classList.add('dragging');
  try { grip.setPointerCapture(e.pointerId); } catch(err){}
  try { if (navigator.vibrate) navigator.vibrate(10); } catch(err){}
  var block = function(ev){ if (ev.cancelable) ev.preventDefault(); };      // stop the page scrolling while an item is held
  grip.addEventListener('touchmove', block, { passive:false });
  function update(){
    var dy = (lastY + window.scrollY) - (startY + sy0);
    row.style.transform = 'translateY(' + dy + 'px)';
    var cy = tops[from].top + rh/2 + dy;
    to = 0;
    for (var i = 0; i < tops.length; i++) { if (cy > tops[i].top + tops[i].h/2) to = i; }
    rows.forEach(function(r, i){
      if (r === row) return;
      var sh = 0;
      if (from < to && i > from && i <= to) sh = -rh;
      if (from > to && i >= to && i < from) sh = rh;
      r.style.transform = sh ? 'translateY(' + sh + 'px)' : '';
    });
  }
  var timer = setInterval(function(){
    if (lastY < 150) window.scrollBy(0, -10); else if (lastY > window.innerHeight - 80) window.scrollBy(0, 10); else return;
    update();
  }, 16);
  function onMove(ev){ lastY = ev.clientY; update(); }
  function end(ev){
    clearInterval(timer);
    grip.removeEventListener('touchmove', block);
    grip.removeEventListener('pointermove', onMove); grip.removeEventListener('pointerup', end); grip.removeEventListener('pointercancel', end);
    try { grip.releasePointerCapture(e.pointerId); } catch(err){}
    if (to !== from && ev.type !== 'pointercancel') { onDrop(from, to); save(); }
    render();
  }
  grip.addEventListener('pointermove', onMove); grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
}

/* ---------- sheets ---------- */
var sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(nodes){
  sheet.innerHTML = '';
  nodes.forEach(function(n){ if (n) sheet.appendChild(n); });
  scrim.style.display = 'block';
  requestAnimationFrame(function(){ sheet.classList.add('open'); });
}
function closeSheet(){
  sheet.classList.remove('open'); scrim.style.display = 'none';
}
scrim.addEventListener('click', closeSheet);
function actions(list){ return h('div', {class:'actions'}, list); }
function btn(text, cls, fn){ return h('button', {class:'btn ' + (cls||''), text:text, onclick:fn}); }

function catSelect(selected, extra){
  var sel = h('select');
  S.categories.forEach(function(c){ var o = h('option', {value:c.id, text:c.name}); if (c.id === selected) o.selected = true; sel.appendChild(o); });
  (extra||[]).forEach(function(e){ sel.appendChild(h('option', {value:e[0], text:e[1]})); });
  sel.appendChild(h('option', {value:'__new', text:'+ New category…'}));
  return sel;
}

function taskSheet(t){
  // base = the original item; the walk-through entry is an independent copy linked by srcId
  var base = (t.wt && t.srcId) ? S.tasks.find(function(x){ return x.id === t.srcId; }) : t;
  if (!base) { base = t; delete t.srcId; }
  var copy = base.wt ? null : S.tasks.find(function(x){ return x.wt && x.srcId === base.id; });
  var wtInitial = !!(base.wt || copy);

  var txt = h('input', {type:'text', value:base.text, autocapitalize:'sentences'});
  var sel = catSelect(base.cat);
  var newName = h('input', {type:'text', placeholder:'New category name', autocapitalize:'sentences', style:'display:none;margin-top:8px'});
  var wt = h('input', {type:'checkbox'}); wt.checked = wtInitial;
  var saveBtn = btn('Save', '', function(){
    var v = capFirst(txt.value.trim()); if (v) base.text = v;
    if (sel.value === '__new') { var n = newName.value.trim(); if (n) base.cat = addCategory(n); }
    else base.cat = sel.value;
    if (base.wt) {                       // legacy item that was moved into the walk-through
      if (!wt.checked) base.wt = false;
    } else if (wt.checked) {
      if (copy) { copy.text = base.text; copy.cat = base.cat; }
      else S.tasks.push({ id:uid(), text:base.text, cat:base.cat, done:false, wt:true, srcId:base.id });
    } else if (copy) {
      S.tasks = S.tasks.filter(function(x){ return x !== copy; });
    }
    save(); closeSheet(); render();
  });
  var changed = function(){
    var newCat = sel.value === '__new' ? newName.value.trim() !== '' : sel.value !== base.cat;
    var v = capFirst(txt.value.trim());
    var c = (v !== '' && v !== base.text) || newCat || wt.checked !== wtInitial;
    saveBtn.disabled = !c;
    newName.style.display = sel.value === '__new' ? 'block' : 'none';
  };
  txt.addEventListener('input', changed); newName.addEventListener('input', changed);
  wt.addEventListener('change', changed);
  sel.addEventListener('change', function(){ changed(); if (sel.value === '__new') newName.focus(); });
  changed();

  openSheet([
    h('h3', {text:'Edit item'}),
    h('label', {text:'Text'}), txt,
    h('label', {text:'Category'}), sel, newName,
    h('div', {class:'row'}, [h('div', {}, [h('div', {text:'Final walk-through'}), h('div', {class:'note', text:'Adds a copy to the walk-through group at the top. The original stays here.'})]), wt]),
    t.done ? h('button', {class:'btn', style:'width:100%;margin:14px 0 0;background:#000;color:#fff;box-shadow:0 0 0 1px #555 inset', text:'Mark as not done', onclick:function(){ t.done = false; t.doneAt = null; save(); closeSheet(); render(); }}) : null,
    actions([
      btn('Delete', 'danger', function(){ S.tasks = S.tasks.filter(function(x){ return x !== base && x !== t && !(x.wt && x.srcId === base.id); }); save(); closeSheet(); render(); }),
      saveBtn
    ])
  ]);
}

function addCategory(name){
  name = capFirst(String(name).trim());
  var ex = S.categories.find(function(c){ return c.name.toLowerCase() === name.toLowerCase(); });
  if (ex) return ex.id;
  var c = { id:uid(), name:name }; S.categories.push(c); return c.id;
}

function newCategorySheet(){
  var inp = h('input', {type:'text', placeholder:'e.g. Garden, Kitchen, Cellar', autocapitalize:'sentences'});
  var go = function(){ var n = inp.value.trim(); if (!n) return; addCategory(n); save(); closeSheet(); render(); };
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
  openSheet([h('h3', {text:'New category'}), inp, actions([btn('Cancel', 'sec', closeSheet), btn('Create', '', go)])]);
  setTimeout(function(){ inp.focus(); }, 250);
}

function categorySheet(c){
  var i = S.categories.indexOf(c);
  openSheet([h('h3', {text:c.name}), h('div', {class:'menu'}, [
    h('button', {text:'Rename', onclick:function(){ renameSheet(c); }}),
    i > 0 ? h('button', {text:'Move up', onclick:function(){ S.categories.splice(i,1); S.categories.splice(i-1,0,c); save(); closeSheet(); render(); }}) : null,
    i < S.categories.length-1 ? h('button', {text:'Move down', onclick:function(){ S.categories.splice(i,1); S.categories.splice(i+1,0,c); save(); closeSheet(); render(); }}) : null,
    h('button', {text:'Untick all in this category', onclick:function(){ S.tasks.forEach(function(t){ if (t.cat === c.id && !t.wt) { t.done = false; t.doneAt = null; } }); save(); closeSheet(); render(); }}),
    h('button', {class:'danger', text:'Delete category…', onclick:function(){ deleteCategorySheet(c); }}),
    h('button', {text:'Close', onclick:closeSheet})
  ])]);
}
function renameSheet(c){
  var inp = h('input', {type:'text', value:c.name, autocapitalize:'sentences'});
  var go = function(){ var n = capFirst(inp.value.trim()); if (n) c.name = n; save(); closeSheet(); render(); };
  var sv = btn('Save','',go);
  var chg = function(){ var v = capFirst(inp.value.trim()); sv.disabled = !v || v === c.name; };
  inp.addEventListener('input', chg);
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !sv.disabled) go(); });
  chg();
  openSheet([h('h3', {text:'Rename category'}), inp, actions([btn('Cancel','sec',closeSheet), sv])]);
}
function deleteCategorySheet(c){
  var n = S.tasks.filter(function(t){ return t.cat === c.id; }).length;
  var others = S.categories.filter(function(x){ return x !== c; });
  var sel = h('select');
  if (others.length) others.forEach(function(o){ sel.appendChild(h('option', {value:o.id, text:'Move items to: ' + o.name})); });
  sel.appendChild(h('option', {value:'__del', text:'Delete the items too'}));
  var nodes = [h('h3', {text:'Delete "' + c.name + '"?'})];
  if (n) { nodes.push(h('p', {class:'note', text: n + ' item' + (n>1?'s':'') + ' in this category.'})); nodes.push(sel); }
  nodes.push(actions([btn('Cancel','sec',closeSheet), btn('Delete','danger',function(){
    if (n) {
      if (sel.value === '__del') S.tasks = S.tasks.filter(function(t){ return t.cat !== c.id; });
      else S.tasks.forEach(function(t){ if (t.cat === c.id) t.cat = sel.value; });
    }
    S.categories = S.categories.filter(function(x){ return x !== c; });
    save(); closeSheet(); render();
  })]));
  openSheet(nodes);
}

/* ---------- seasons / history ---------- */
function fmtDate(iso){ try { return new Date(iso).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}); } catch(e){ return ''; } }
function finishSeasonSheet(){
  var total = S.tasks.length, done = S.tasks.filter(function(t){ return t.done; }).length;
  var inp = h('input', {type:'text', value:String(new Date().getFullYear())});
  openSheet([
    h('h3', {text:'Finish this season'}),
    h('p', {class:'note', text:'Saves a snapshot of the list as it is now (' + done + ' of ' + total + ' done), then unticks everything for next time. Your items and categories stay.'}),
    h('label', {text:'Name of this season'}), inp,
    actions([btn('Cancel','sec',closeSheet), btn('Archive & reset','',function(){
      S.archive.unshift({ id:uid(), name:capFirst(inp.value.trim()) || String(new Date().getFullYear()), savedAt:new Date().toISOString(),
        categories:JSON.parse(JSON.stringify(S.categories)), tasks:JSON.parse(JSON.stringify(S.tasks)) });
      S.tasks.forEach(function(t){ t.done = false; t.doneAt = null; });
      save(); closeSheet(); render(); toast('Season archived');
    })])
  ]);
}
function pastSeasonsSheet(){
  var nodes = [h('h3', {text:'Past seasons'})];
  if (!S.archive.length) nodes.push(h('p', {class:'note', text:'Nothing archived yet. Use "Finish season" when you are done for the year.'}));
  else nodes.push(h('div', {class:'menu'}, S.archive.map(function(a){
    var d = a.tasks.filter(function(t){ return t.done; }).length;
    return h('button', {text:a.name + '  —  ' + d + '/' + a.tasks.length + ' done', onclick:function(){ seasonDetailSheet(a); }});
  })));

}
function seasonDetailSheet(a){
  var d = a.tasks.filter(function(t){ return t.done; }).length;
  var nodes = [h('h3', {text:a.name}), h('p', {class:'note', text:'Archived ' + fmtDate(a.savedAt) + ' · ' + d + ' of ' + a.tasks.length + ' done'})];
  var wt = a.tasks.filter(function(t){ return t.wt; });
  var groups = [];
  if (wt.length) groups.push({ name:'★ Final walk-through', tasks:wt });
  a.categories.forEach(function(c){ var ts = a.tasks.filter(function(t){ return !t.wt && t.cat === c.id; }); if (ts.length) groups.push({ name:c.name, tasks:ts }); });
  groups.forEach(function(g){
    nodes.push(h('label', {text:g.name}));
    g.tasks.forEach(function(t){
      nodes.push(h('div', {class:'row', style:'padding:6px 0;justify-content:flex-start;align-items:flex-start'}, [
        h('span', {text: t.done ? '✓' : '○', style:'width:22px;font-weight:700;color:' + (t.done ? 'var(--accent)' : 'var(--danger)')}),
        h('span', {style: t.done ? 'color:var(--muted)' : ''}, [t.text, t.done && t.doneAt ? h('small', {text:'  ' + fmtDate(t.doneAt), style:'color:var(--muted)'}) : null])
      ]));
    });
  });
  nodes.push(actions([
    btn('Delete','danger',function(){ confirmSheet('Delete "' + a.name + '"?', 'This season will be removed permanently.', 'Delete', function(){ S.archive = S.archive.filter(function(x){ return x !== a; }); save(); render(); }); }),
    btn('Back','sec',pastSeasonsSheet)
  ]));
  openSheet(nodes);
}

/* ---------- backup / restore ---------- */
function exportBackup(){
  var data = JSON.stringify({ app:'katsdorf-checklist', exported:new Date().toISOString(), state:S }, null, 1);
  var name = 'katsdorf-checklist-backup.json';
  var file; try { file = new File([data], name, {type:'application/json'}); } catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:name}).catch(function(){});
  } else {
    var a = h('a', {href:URL.createObjectURL(new Blob([data], {type:'application/json'})), download:name});
    document.body.appendChild(a); a.click(); a.remove();
  }
  closeSheet();
}
document.getElementById('fileRestore').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = ''; if (!f) return;
  f.text().then(function(txt){
    var j = JSON.parse(txt), s = j.state || j;
    if (!s || !Array.isArray(s.tasks) || !Array.isArray(s.categories)) throw new Error('bad');
    confirmSheet('Restore backup?', 'This replaces the current list with ' + s.tasks.length + ' items from the backup.', 'Restore', function(){
      S = normalize({ categories:s.categories, tasks:s.tasks, hideDone:!!s.hideDone, collapsed:s.collapsed||{}, archive:s.archive||[] }); save(); render(); toast('Backup restored');
    });
  }).catch(function(){ toast('That file is not a valid backup'); });
});

/* ---------- Excel / CSV import ---------- */
function loadScript(src){
  return new Promise(function(res, rej){
    if (window.XLSX) return res();
    var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('Could not load importer (offline?)')); };
    document.head.appendChild(s);
  });
}
function truthy(v){ return /^\s*(y|yes|x|1|true|ja|j|✓|✔|★|\*)/i.test(String(v)); }

function capFirst(x){ x = String(x); return (x.charAt(0) === '\u00DF') ? x : x.charAt(0).toUpperCase() + x.slice(1); }
function parseBlocks(raw){
  // single-column list: groups separated by blank rows; first row of a group is its category title
  var out = [], block = [];
  var flush = function(){
    if (block.length > 1) {
      var cat = capFirst(block[0].replace(/:\s*$/, '').trim());
      block.slice(1).forEach(function(t){ out.push({ cat:cat, text:capFirst(t), wt:false }); });
    }
    block = [];
  };
  raw.forEach(function(r){ var v = String(r[0] == null ? '' : r[0]).trim(); if (v) block.push(v); else flush(); });
  flush();
  return out;
}
function parseWorkbook(wb){
  var out = [];
  wb.SheetNames.forEach(function(sn){
    var raw = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:false});
    var rows = raw.filter(function(r){ return r.some(function(c){ return String(c).trim(); }); });
    if (!rows.length) return;
    var col2 = rows.filter(function(r){ return String(r[1] == null ? '' : r[1]).trim(); }).length;
    if (col2 <= Math.max(1, rows.length * 0.1)) { out = out.concat(parseBlocks(raw)); return; }
    var hdr = rows[0].map(function(c){ return String(c).toLowerCase().trim(); });
    var ci = hdr.findIndex(function(x){ return /categ|kateg|group|grupp|area|bereich|room|raum|section/.test(x); });
    var ti = hdr.findIndex(function(x){ return /task|item|aufgabe|todo|to-do|punkt|what|descr|beschr|check/.test(x) && !/walk/.test(x); });
    var wi = hdr.findIndex(function(x){ return /walk|final|rundgang|schluss|last/.test(x); });
    var hasHeader = ti !== -1 || ci !== -1 || wi !== -1;
    var start = hasHeader ? 1 : 0;
    if (!hasHeader) { ci = 0; ti = 1; wi = rows[0].length > 2 ? 2 : -1; }
    else if (ti === -1) ti = (ci === 0) ? 1 : 0;
    for (var i = start; i < rows.length; i++) {
      var r = rows[i], text = String(r[ti] == null ? '' : r[ti]).trim();
      if (!text) continue;
      var cat = ci >= 0 ? String(r[ci]).trim() : '';
      if (!cat) cat = (out.length && ci >= 0) ? out[out.length-1].cat : sn;
      out.push({ cat:cat, text:text, wt: wi >= 0 && truthy(r[wi]) });
    }
  });
  return out;
}

document.getElementById('fileImport').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = ''; if (!f) return;
  loadScript('xlsx.mini.min.js').then(function(){ return f.arrayBuffer(); }).then(function(buf){
    var wb = XLSX.read(buf, {type:'array', codepage:65001});
    var items = parseWorkbook(wb);
    if (!items.length) { toast('No items found in that file'); return; }
    var cats = {}; items.forEach(function(i){ cats[i.cat] = 1; });
    var nc = Object.keys(cats).length, nw = items.filter(function(i){ return i.wt; }).length;
    var apply = function(replace){
      if (replace) { S.categories = []; S.tasks = []; }
      items.forEach(function(i){
        var cid = addCategory(i.cat);
        if (!replace && S.tasks.some(function(t){ return !t.wt && t.cat === cid && t.text.toLowerCase() === i.text.toLowerCase(); })) return;
        var id = uid();
        S.tasks.push({ id:id, text:capFirst(i.text), cat:cid, done:false, wt:false });
        if (i.wt) S.tasks.push({ id:uid(), text:capFirst(i.text), cat:cid, done:false, wt:true, srcId:id });
      });
      save(); closeSheet(); render(); toast('Imported ' + items.length + ' items');
    };
    openSheet([
      h('h3', {text:'Import list'}),
      h('p', {class:'note', text: items.length + ' items in ' + nc + ' categor' + (nc>1?'ies':'y') + (nw ? ', ' + nw + ' marked as final walk-through' : '') + '.'}),
      h('p', {class:'note', text:'Single column with blank rows between groups (first line of each group = category), or columns Category / Task / Walk-through.'}),
      actions([btn('Cancel','sec',closeSheet), btn('Add to list','sec',function(){ apply(false); }), btn('Replace list','danger',function(){ apply(true); })])
    ]);
  }).catch(function(err){ toast(err.message || 'Import failed'); });
});

/* every text field: first letter becomes a capital as you type */
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el || el.tagName !== 'INPUT' || el.type !== 'text') return;
  var v = el.value;
  if (v && v.charAt(0) !== capFirst(v).charAt(0)) {
    var a = el.selectionStart, b = el.selectionEnd;
    el.value = capFirst(v);
    try { el.setSelectionRange(a, b); } catch(err){}
  }
}, true);

function setAllCollapsed(v){
  S.categories.forEach(function(c){ S.collapsed[c.id] = v; });

}
